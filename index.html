<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraq AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 30px 15px;
            margin: 0;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-header {
            background: #2563eb;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9fafb;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Buraq AI Assistant</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">Hello! Main Buraq AI hoon. Aaj main aapki kya madad kar sakta hoon?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Yahan apna sawal likhein..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Bhejein</button>
        </div>
    </div>

    <script>
        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const chatMessages = document.getElementById('chatMessages');

            if (messageText === '') return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = 'Soch raha hoon...';
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                let reply = "Ye ek sample AI response hai. Aap isme baad mein apni marzi ki coding ya API connect kar sakte hain!";
                if (messageText.toLowerCase().includes('kaise ho') || messageText.toLowerCase().includes('hello')) {
                    reply = "Main bilkul theek hoon! Aap sunayein, aap kaise hain?";
                } else if (messageText.toLowerCase().includes('naam')) {
                    reply = "Mera naam Buraq AI hai!";
                }
                aiMsgDiv.textContent = reply;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }
    </script>

</body>
</html>
