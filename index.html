<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraq AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
            margin: 0;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 520px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title {
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: none;
            background: white;
            color: #2563eb;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .quick-actions {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            overflow-x: auto;
            white-space: nowrap;
        }
        .action-btn {
            background: #white;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #e2e8f0;
            color: #0f172a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 8px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #2563eb;
        }
        .send-btn {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .send-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Top Language Header -->
        <div class="chat-header">
            <span class="chat-title" id="headerTitle">⚡ Buraq AI Assistant</span>
            <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </div>

        <!-- Quick Shortcut Actions -->
        <div class="quick-actions">
            <button class="action-btn" onclick="sendQuickMsg('Tell me a funny joke')">😄 Joke</button>
            <button class="action-btn" onclick="sendQuickMsg('I am feeling very bored')">🎮 I\'m Bored</button>
            <button class="action-btn" onclick="sendQuickMsg('Let\'s play a quiz game')">🧠 Quiz Game</button>
            <button class="action-btn" onclick="sendQuickMsg('Help me with HTML code')">💻 Code Helper</button>
            <button class="action-btn" onclick="sendQuickMsg('I am hungry')">🍕 Hungry</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message" id="welcomeMsg">Hey buddy! I'm Buraq AI, your web companion. Chat with me, ask for code, play a game, or tell me how you feel!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKey(event)">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "⚡ Buraq AI Assistant",
                welcome: "Hey buddy! I'm Buraq AI, your web companion. Chat with me, ask for code, play a game, or tell me how you feel!",
                placeholder: "Type your message here...",
                send: "Send",
                thinking: "Buraq is thinking..."
            },
            ur: {
                title: "⚡ براق اے آئی اسسٹنٹ",
                welcome: "ارے دوست! میں براق اے آئی ہوں۔ مجھ سے بات کرو، کوڈنگ سیکھو، گیم کھیلو یا جو دل چاہے بتاؤ!",
                placeholder: "یہاں اپنا پیغام لکھیں...",
                send: "بھیجیں",
                thinking: "براق سوچ رہا ہے..."
            },
            ar: {
                title: "⚡ مساعد براق الذكي",
                welcome: "أهلاً بك! أنا مساعد براق. تحدث معي، اطلب مني الأكواد البرمجية، أو نلعب لعبة معاً!",
                placeholder: "اكتب رسالتك هنا...",
                send: "إرسال",
                thinking: "جاري التفكير..."
            },
            hi: {
                title: "⚡ बुराक़ एआई सहायक",
                welcome: "अरे दोस्त! मैं बुराक़ एआई हूँ। मुझसे बात करो, कोड सीखो, या गेम खेलो!",
                placeholder: "यहाँ अपना संदेश लिखें...",
                send: "भेजें",
                thinking: "सोच रहा हूँ..."
            },
            es: {
                title: "⚡ Asistente Buraq AI",
                welcome: "¡Hola amigo! Soy Buraq AI. Chatea conmigo, pídeme código o juguemos a algo divertido.",
                placeholder: "Escribe tu mensaje aquí...",
                send: "Enviar",
                thinking: "Pensando..."
            },
            fr: {
                title: "⚡ Assistant Buraq AI",
                welcome: "Salut mon pote ! Je suis Buraq AI. On peut discuter, coder ou jouer ensemble !",
                placeholder: "Tapez votre message ici...",
                send: "Envoyer",
                thinking: "En train de réfléchir..."
            }
        };

        const jokes = {
            en: [
                "Why don't programmers like nature? It has too many bugs! 😂",
                "Why did the computer go to the doctor? Because it had a virus! 🖥️😷",
                "Parallel lines have so much in common. It's a shame they'll never meet! 😄"
            ],
            ur: [
                "استاد: بتاؤ ناکام اور کامیاب انسان میں کیا فرق ہے؟\nشاگرد: ناکام موبائل چارجر ڈھونڈتا ہے، اور کامیاب چارجر لگا کر سو جاتا ہے! 😂",
                "دوست 1: یار میں جو بھی سوچتا ہوں بھول جاتا ہوں۔\nدوست 2: کب سے؟\nدوست 1: کیا کب سے؟ 😂"
            ]
        };

        const quizzes = [
            { q: "Which planet is known as the Red Planet? (A) Mars (B) Venus", a: "A" },
            { q: "What does HTML stand for? (A) HyperText Markup Language (B) High Tech Multi Language", a: "A" },
            { q: "How many hours are there in a day? (A) 12 (B) 24", a: "B" }
        ];

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('headerTitle').textContent = translations[lang].title;
            document.getElementById('welcomeMsg').textContent = translations[lang].welcome;
            document.getElementById('userInput').placeholder = translations[lang].placeholder;
            document.getElementById('sendBtn').textContent = translations[lang].send;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function sendQuickMsg(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function getSmartReply(text, lang) {
            const t = text.toLowerCase();

            // 1. Jokes
            if (t.includes('joke') || t.includes('latifa') || t.includes('chutkula')) {
                const list = jokes[lang] || jokes['en'];
                return list[Math.floor(Math.random() * list.length)];
            }

            // 2. Quiz / Game
            if (t.includes('quiz') || t.includes('game') || t.includes('khel')) {
                const quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
                return `🎯 Quiz Time:\n${quiz.q}\n\nType your choice!`;
            }

            // 3. Coding Helper
            if (t.includes('code') || t.includes('html') || t.includes('css') || t.includes('javascript') || t.includes('program')) {
                if (lang === 'ur') return "💻 کوڈنگ میں کیا مدد چاہیے دوست؟ میں HTML, CSS, JavaScript اور Python کا بنیادی کوڈ لکھ سکتا ہوں!";
                return "💻 Need coding help? Ask me to write HTML, CSS, JavaScript or basic Python code for you!";
            }

            // 4. Greetings
            if (t.includes('hi') || t.includes('hello') || t.includes('salam') || t.includes('hey') || t.includes('assalam')) {
                if (lang === 'ur') return "وعلیکم السلام یار! سناؤ کیسے ہو؟ سب خیریت ہے؟";
                if (lang === 'ar') return "أهلاً وسهلاً! كيف حالك يا صديقي؟";
                if (lang === 'hi') return "नमस्ते यार! कैसे हो सब ठीक-ठाक?";
                return "Hey buddy! So good to hear from you. How's it going?";
            }

            // 5. Boredom
            if (t.includes('bore') || t.includes('boring') || t.includes('farigh')) {
                if (lang === 'ur') return "اوہو! بور ہو رہے ہو؟ چلو اوپر 'Quiz Game' یا 'Joke' wale button par click karo, maza aaye ga!";
                return "Bored? Let's fix that! Click the 'Quiz Game' or 'Joke' button above to have some fun! 🎮";
            }

            // 6. Hunger
            if (t.includes('hungry') || t.includes('bhook') || t.includes('khana') || t.includes('eat')) {
                if (lang === 'ur') return "اوہو، بھوک لگ گئی! جلدی سے جا کر کچھ مزے دار پیزا یا برگر کھا لو 🍕🍔!";
                return "Hungry?! Time to grab a delicious pizza or burger 🍕🍔!";
            }

            // 7. Money
            if (t.includes('rupeis') || t.includes('rupee') || t.includes('pese') || t.includes('money') || t.includes('cash')) {
                if (lang === 'ur') return "واہ بھائی! اتنے پیسوں میں تو زبردست چائے اور سموسے کا پروگرام بن سکتا ہے ☕!";
                return "Awesome! That's enough for a nice cup of tea or a quick snack ☕!";
            }

            // Fallback Friendly Dynamic Replies
            const replies = {
                en: [
                    "That's super interesting! Tell me more about it, I'm all ears.",
                    "Haha, wow! I like how you think. What else is on your mind?",
                    "That sounds awesome, buddy! How can I help you take it further?",
                    "Hmm, fascinating point! Let's chat more about this."
                ],
                ur: [
                    "واہ یار! یہ تو بڑی زبردست بات کہی آپ نے، اس بارے میں اور بتاؤ۔",
                    "ہیہا! یہ واقعی مزے کی بات ہے۔ اور بتاؤ آج کیا پلان ہے؟",
                    "یہ تو کمال ہو گیا! اس میں میں آپ کی کیا مدد کر سکتا ہوں؟",
                    "آپ کی باتیں واقعی دل کو لگتی ہیں! اور سناؤ کیا چل رہا ہے؟"
                ]
            };

            const langReplies = replies[lang] || replies['en'];
            return langReplies[Math.floor(Math.random() * langReplies.length)];
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const chatMessages = document.getElementById('chatMessages');
            const lang = document.getElementById('langSelect').value;

            if (messageText === '') return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = translations[lang].thinking;
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                aiMsgDiv.textContent = getSmartReply(messageText, lang);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        }
    </script>

</body>
</html>
