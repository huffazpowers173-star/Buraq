<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraq Live AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
            margin: 0;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 520px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title {
            font-weight: bold;
            font-size: 18px;
        }
        /* Instruction text above the yellow bar */
        .api-instruction {
            background: #fef3c7;
            padding: 6px 12px;
            font-size: 12px;
            color: #78350f;
            border-bottom: 1px dashed #fde68a;
            font-weight: 500;
        }
        .api-settings {
            padding: 8px 12px;
            background: #fffbeb;
            border-bottom: 1px solid #fde68a;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 13px;
        }
        .api-settings input {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 12px;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f8fafc;
        }
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background: #e2e8f0;
            color: #0f172a;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e2e8f0;
            gap: 8px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .send-btn {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .send-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <span class="chat-title">⚡ Buraq Live AI</span>
        </div>

        <!-- Instruction written right above -->
        <div class="api-instruction">
            💡 Pehle yahan apni free Groq API key paste karein:
        </div>

        <!-- API Key Input Bar -->
        <div class="api-settings">
            <span style="font-weight: bold; color: #92400e;">Groq Key:</span>
            <input type="password" id="apiKeyInput" placeholder="Paste your Groq API key here">
        </div>

        <!-- Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">Hey buddy! Paste your Groq API key in the yellow bar above, and let's start chatting live!</div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask me anything..." onkeypress="handleKey(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const apiKeyInput = document.getElementById('apiKeyInput');
            const messageText = inputField.value.trim();
            const chatMessages = document.getElementById('chatMessages');
            const apiKey = apiKeyInput.value.trim();

            if (messageText === '') return;

            if (!apiKey) {
                alert("Please enter your Groq API key in the top yellow bar first!");
                return;
            }

            // User Message Display
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Thinking Message
            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = "Buraq is thinking...";
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "openai/gpt-oss-20b",
                        "messages": [
                            {"role": "system", "content": "You are Buraq AI, a friendly, casual, smart buddy assistant."},
                            {"role": "user", "content": messageText}
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.choices && data.choices.length > 0) {
                    aiMsgDiv.textContent = data.choices[0].message.content;
                } else if (data.error) {
                    aiMsgDiv.textContent = "Error: " + (data.error.message || "Invalid API Key");
                } else {
                    aiMsgDiv.textContent = "Oops! Something went wrong.";
                }
            } catch (error) {
                aiMsgDiv.textContent = "Connection failed! Check your internet or API key.";
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>

</body>
</html>
