<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buraq AI Assistant</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding: 20px 15px;
            margin: 0;
        }
        .chat-container {
            background: white;
            width: 100%;
            max-width: 500px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .chat-header {
            background: #2563eb;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-title {
            font-weight: bold;
            font-size: 16px;
        }
        .lang-select {
            padding: 5px 8px;
            border-radius: 4px;
            border: none;
            background: white;
            color: #2563eb;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f9fafb;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }
        .user-message {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .ai-message {
            background: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: white;
            border-top: 1px solid #e5e7eb;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Top-Right Language Switcher Header -->
        <div class="chat-header">
            <span class="chat-title" id="headerTitle">Buraq AI Assistant</span>
            <select id="langSelect" class="lang-select" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="ar">العربية</option>
                <option value="hi">हिन्दी</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
            </select>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message" id="welcomeMsg">Hey there! I'm Buraq AI, your friendly buddy. What's on your mind today?</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Type your message here..." onkeypress="handleKey(event)">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const translations = {
            en: {
                title: "Buraq AI Assistant",
                welcome: "Hey there! I'm Buraq AI, your friendly buddy. What's on your mind today?",
                placeholder: "Type your message here...",
                send: "Send",
                thinking: "Buraq is thinking..."
            },
            ur: {
                title: "براق اے آئی اسسٹنٹ",
                welcome: "ارے دوست! میں براق اے آئی ہوں، آپ کا یار۔ بتائیے آج کیا چل رہا ہے ذہن میں؟",
                placeholder: "یہاں اپنا پیغام لکھیں...",
                send: "بھیجیں",
                thinking: "براق سوچ رہا ہے..."
            },
            ar: {
                title: "مساعد براق الذكي",
                welcome: "أهلاً بك! أنا مساعد براق، صديقك المخلص. بماذا يمكنني مساعدتك اليوم؟",
                placeholder: "اكتب رسالتك هنا...",
                send: "إرسال",
                thinking: "جاري التفكير..."
            },
            hi: {
                title: "बुराक़ एआई सहायक",
                welcome: "अरे दोस्त! मैं बुराक़ एआई हूँ, आपका यार। बताइए आज क्या बात करनी है?",
                placeholder: "यहाँ अपना संदेश लिखें...",
                send: "भेजें",
                thinking: "सोच रहा हूँ..."
            },
            es: {
                title: "Asistente Buraq AI",
                welcome: "¡Hola amigo! Soy Buraq AI, tu compas. ¿De qué quieres hablar hoy?",
                placeholder: "Escribe tu mensaje aquí...",
                send: "Enviar",
                thinking: "Pensando..."
            },
            fr: {
                title: "Assistant Buraq AI",
                welcome: "Salut mon ami ! Je suis Buraq AI, ton pote. De quoi veut-on parler ?",
                placeholder: "Tapez votre message ici...",
                send: "Envoyer",
                thinking: "En train de réfléchir..."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('headerTitle').textContent = translations[lang].title;
            document.getElementById('welcomeMsg').textContent = translations[lang].welcome;
            document.getElementById('userInput').placeholder = translations[lang].placeholder;
            document.getElementById('sendBtn').textContent = translations[lang].send;
        }

        function handleKey(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Super Smart Contextual & Friendly Replies
        function getSmartReply(text, lang) {
            const t = text.toLowerCase();
            
            // 1. Greetings
            if (t.includes('hi') || t.includes('hello') || t.includes('salam') || t.includes('hey') || t.includes('assalam')) {
                if (lang === 'ur') return "وعلیکم السلام یار! سناؤ کیسے ہو؟ سب خیریت ہے؟";
                if (lang === 'ar') return "أهلاً وسهلاً! كيف حالك يا صديقي؟";
                if (lang === 'hi') return "नमस्ते यार! कैसे हो सब ठीक-ठाक?";
                if (lang === 'es') return "¡Hola amigo! ¿Qué tal todo?";
                return "Hey buddy! So good to hear from you. How's it going?";
            }
            
            // 2. Name / Identity
            if (t.includes('name') || t.includes('naam') || t.includes('kaun ho')) {
                if (lang === 'ur') return "مرا نام براق اے آئی ہے، اور میں ہر وقت آپ کا دوست بن کر بات کرنے کے لیے حاضر ہوں!";
                if (lang === 'hi') return "मेरा नाम बुराक़ एआई है, और मैं आपका पक्का दोस्त हूँ!";
                return "I'm Buraq AI, your personal buddy! Always here to chat and help you out.";
            }

            // 3. Boredom (Bore hona)
            if (t.includes('bore') || t.includes('boring') || t.includes('farigh')) {
                if (lang === 'ur') return "اچھا! بور ہو رہے ہو؟ چلو کوئی گیم کھیلیں، یا کسی مزے دار ٹاپک پر گپ شپ لگاتے ہیں!";
                if (lang === 'hi') return "अरे बोर हो रहे हो? चलो कोई मजेदार बात करते हैं या कोई चुटकुला सुनाऊँ?";
                if (lang === 'es') return "¡Vaya, aburrido! ¿Jugamos a algo o charlamos de algo divertido?";
                return "Feeling bored? Let's fix that! We can chat about a cool topic, or I can tell you a joke. What do you prefer?";
            }

            // 4. Hunger (Bhook lagna)
            if (t.includes('hungry') || t.includes('bhook') || t.includes('khana') || t.includes('eat')) {
                if (lang === 'ur') return "اوہو، بھوک لگ گئی! جلدی سے جا کر کچھ مزے دار کھا کر آؤ، یا بتاؤ کیا کھانے کا دل چاہ رہا ہے؟";
                if (lang === 'hi') return "ओहो, भूख लग गई! जल्दी से कुछ टेस्टी खा लो यार, क्या खाने का मन है?";
                return "Oh, hungry?! Time to grab some delicious food! What are you planning to eat?";
            }

            // 5. Money / Rupees / Budget (Pese hona)
            if (t.includes('rupeis') || t.includes('rupee') || t.includes('pese') || t.includes('money') || t.includes('cash')) {
                if (lang === 'ur') return "واہ بھائی! اتنے پیسوں میں تو کوئی زبردست سی ٹریٹ بنتی ہے یا چھوٹی موٹی مزیدار چیز آ سکتی ہے!";
                if (lang === 'hi') return "अरे वाह! इतने पैसों में तो कोई बढ़िया सी छोटी-मोटी ट्रीट बनती है यार!";
                return "Nice! With that amount, you can definitely treat yourself to something nice or save it for a rainy day!";
            }

            // General Random Friendly Replies
            const replies = {
                en: [
                    "That's super interesting! Tell me more about it, I'm all ears.",
                    "Haha, wow! I never thought of it that way. What else is on your mind?",
                    "That sounds awesome, buddy! How can I help you take it further?",
                    "Hmm, fascinating point! Let's chat more about this.",
                    "You always come up with cool topics! What's next?"
                ],
                ur: [
                    "واہ یار! یہ تو بڑی زبردست بات کہی آپ نے، اس بارے میں اور بتاؤ۔",
                    "ہیہا! یہ واقعی مزے کی بات ہے۔ اور بتاؤ آج کیا پلان ہے؟",
                    "یہ تو کمال ہو گیا! اس میں میں آپ کی کیا مدد کر سکتا ہوں؟",
                    "ہممم، بالکل صحیح کہا! دوست کی طرح کہوں تو یہ ائیڈیا کافی شاندار ہے۔",
                    "آپ کی باتیں واقعی دل کو لگتی ہیں! اور سناؤ کیا چل رہا ہے؟"
                ],
                ar: [
                    "هذا مذهل حقاً! أخبرني المزيد عن هذا الموضوع يا صديقي.",
                    "هذا رائع! ما هي أفكارك الأخرى اليوم؟",
                    "أعجبني ما تقول! كيف يمكنني مساعدتك أكثر؟"
                ],
                hi: [
                    "वाह यार! यह बहुत बढ़िया बात बोली आपने, इसके बारे में और बताओ।",
                    "हाहा, सच में! यह काफी दिलचस्प है। आगे क्या सोचा है?",
                    "मज़ा आ गया सुन कर! इसमें मैं क्या मदद करूँ?"
                ],
                es: [
                    "¡Eso es súper interesante! Cuéntame más, amigo.",
                    "¡Jaja, qué genial! ¿Qué más tienes en mente hoy?",
                    "¡Me encanta esa idea! ¿Cómo te ayudo con eso?"
                ],
                fr: [
                    "C'est super intéressant ! Dis-m'en plus, mon pote.",
                    "Haha, génial ! Qu'est-ce d'autre te préoccupe aujourd'hui ?",
                    "J'adore ton idée ! Comment on avance ?"
                ]
            };

            const langReplies = replies[lang] || replies['en'];
            const randomIndex = Math.floor(Math.random() * langReplies.length);
            return langReplies[randomIndex];
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            const chatMessages = document.getElementById('chatMessages');
            const lang = document.getElementById('langSelect').value;

            if (messageText === '') return;

            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = messageText;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai-message';
            aiMsgDiv.textContent = translations[lang].thinking;
            chatMessages.appendChild(aiMsgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                aiMsgDiv.textContent = getSmartReply(messageText, lang);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 1000);
        }
    </script>

</body>
</html>
